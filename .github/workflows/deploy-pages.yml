name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If Pages "Source" is still "Deploy from a branch", GitHub also runs its
      # own "pages build and deployment", which publishes the raw source and
      # blanks the site. Wait for it so this built deploy always lands last.
      - name: Wait for GitHub's branch deploy (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            pending=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" \
              --jq '[.workflow_runs[] | select(.name=="pages build and deployment" and .status!="completed")] | length')
            [ "$pending" = "0" ] && exit 0
            echo "branch deploy still running, waiting…"; sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
